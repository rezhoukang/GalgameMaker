# Air 热更新配置：go run 后端时自动监听 .go 文件变化并重启
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main.exe ."
  entrypoint = "./tmp/main.exe"
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["tmp", "Index SQLite", "Galgame Makerope", "Galgame Output", "data", "dist", "node_modules"]
  delay = 1000
  stop_on_error = true
  log = "air.log"

[log]
  time = true

[misc]
  clean_on_exit = true
