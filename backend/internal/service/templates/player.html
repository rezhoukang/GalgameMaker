<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galgame 互动视频</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;font-family:'Microsoft YaHei',sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;background:#000}
#page{position:fixed;inset:0;border:none;width:100%;height:100%}
#bar{position:fixed;top:16px;left:16px;z-index:9;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.55);padding:8px 14px;border-radius:12px}
#bar button{background:transparent;border:none;color:#fff;font-size:20px;cursor:pointer;line-height:1}
#bar input[type=range]{width:110px;height:4px;accent-color:#fff;cursor:pointer}
#restart{position:fixed;top:16px;right:16px;z-index:9;display:none;background:rgba(0,0,0,.55);color:#fff;border:none;padding:12px 30px;font-size:16px;font-weight:700;border-radius:12px;cursor:pointer}
#restart:hover{background:rgba(0,0,0,.78)}
#opts{position:fixed;left:0;right:0;bottom:42px;display:none;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;z-index:10}
.opt{display:inline-block;padding:14px 34px;background:rgba(0,0,0,.78);color:#fff;border:1px solid rgba(255,255,255,.22);font-size:16px;font-weight:600;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.4);cursor:pointer;transition:.15s}
.opt:hover{transform:translateY(-2px);background:rgba(46,46,52,.9)}
#next{position:fixed;right:20px;bottom:42px;display:none;background:rgba(0,0,0,.7);color:#fff;border:1px solid rgba(255,255,255,.25);padding:12px 26px;font-size:15px;font-weight:700;border-radius:10px;cursor:pointer;z-index:10}
#next:hover{background:rgba(46,46,52,.95)}
#playback-error{position:fixed;inset:0;background:#000;z-index:8;display:none;align-items:center;justify-content:center;padding:48px}
#playback-error-text{color:#fff;font-size:26px;line-height:1.9;text-align:center;max-width:680px;white-space:pre-wrap}
#start-wrap{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(1200px 600px at 50% -10%,#1c1c28,#0e0e14 60%)}
#start-wrap h1{color:#fff;font-size:40px;letter-spacing:2px}
#start-wrap .sub{color:#777;font-size:14px}
#start{display:inline-block;padding:16px 64px;background:#d97706;color:#fff;font-size:20px;font-weight:700;border:none;border-radius:14px;box-shadow:0 8px 30px rgba(217,119,6,.4);cursor:pointer;transition:.15s}
#continue{padding:12px 42px;border:1px solid #888;border-radius:12px;background:transparent;color:white;font-size:18px;cursor:pointer}
#save-notice{position:fixed;bottom:12px;left:12px;right:12px;color:#fff;background:rgba(0,0,0,.8);padding:10px;z-index:30;font-size:13px;display:none}
#start:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(217,119,6,.5)}
</style>
</head>
<body>
<div id="start-wrap"><h1>Galgame 互动视频</h1><p class="sub" id="start-message">点击开始</p><button id="continue" style="display:none">继续游戏</button><button id="start">▶ 新游戏</button></div>
<div id="stage"></div>
<div id="bar">
<button id="mute" type="button" title="静音/取消静音">🔊</button>
<input id="vol" type="range" min="0" max="100" value="100" title="音量">
</div>
<button id="restart" type="button">↺ 重来</button>
<div id="opts"></div>
<button id="next" type="button">继续 ▸</button>
<div id="playback-error"><div id="playback-error-text"></div></div>
<div id="save-notice" role="status"></div>
<script type="application/json" id="story-meta">__STORY_META__</script>
<script type="application/json" id="story-data">__STORY_DATA__</script>
<script>
__STORY_RUNTIME__
var META = JSON.parse(document.getElementById('story-meta').textContent);
var DATA = JSON.parse(document.getElementById('story-data').textContent);
var FIRST = __FIRST_NODE__;
var runtime = createStoryRuntime(DATA, META.variables, FIRST);
var state = runtime.initial(), saved = null, visit = 0, transitioning = false;
var saveKey = 'galgame-play-v1-' + META.projectKey;
var notice = document.getElementById('save-notice');
function report(text){ notice.textContent=text; notice.style.display='block'; }
function persist(){
  try { localStorage.setItem(saveKey,JSON.stringify({revision:META.revision,state:state})); }
  catch (_){ report('无法保存进度：浏览器存储不可用或空间不足。本次仍可继续游玩。'); }
}
try {
  var raw = localStorage.getItem(saveKey);
  if(raw){
    var record = JSON.parse(raw);
    if(record.revision === META.revision && runtime.validState(record.state)) saved = record.state;
    else document.getElementById('start-message').textContent='旧存档与当前剧情不兼容或已损坏，请开始新游戏。';
  }
} catch (_){ document.getElementById('start-message').textContent='无法读取本地存档，可以开始新游戏。'; }
if(saved) document.getElementById('continue').style.display='block';
var cur = null, page = null, started = false, completed = false;
var volume = 1, muted = false;
var stage = document.getElementById('stage');
var optsBox = document.getElementById('opts');
var nextBtn = document.getElementById('next');
var playbackError = document.getElementById('playback-error');
var playbackErrorText = document.getElementById('playback-error-text');
var restartBtn = document.getElementById('restart');
var muteBtn = document.getElementById('mute');
var volBar = document.getElementById('vol');
function syncRoute(){
  try { history.replaceState(null, '', '#/node/' + DATA[String(state.currentNode)].hash); } catch (_) {}
}
// 浏览器前进后退或手改地址不推进剧情，也不重放变量效果。
window.addEventListener('hashchange', function(){ if(started) syncRoute(); });
window.addEventListener('popstate', function(){ if(started) syncRoute(); });
function choose(port, expectedVisit){
  if(!started || !completed || transitioning || expectedVisit !== visit) return;
  transitioning = true;
  try {
    var nextState = runtime.transition(state,port.id);
    state = nextState; persist(); syncRoute(); show(state.currentNode);
  } catch (err) { transitioning = false; report(err.message || '无法跳转'); }
}
function syncBar(){
  muteBtn.textContent = muted ? '🔇' : '🔊';
  volBar.value = Math.round(volume * 100);
  if(page && page.contentWindow){ page.contentWindow.postMessage({channel:'galgame-player', type:'volume', volume:volume, muted:muted}, '*'); }
}
muteBtn.addEventListener('click', function(){ muted = !muted; syncBar(); });
volBar.addEventListener('input', function(){ volume = volBar.value / 100; muted = volume === 0; syncBar(); });
document.addEventListener('keydown', function(e){
  if(e.key === 'ArrowUp'){ volume = Math.min(1, volume + 0.1); muted = false; syncBar(); }
  else if(e.key === 'ArrowDown'){ volume = Math.max(0, volume - 0.1); muted = volume === 0; syncBar(); }
});
function show(id){
  var sc = DATA[String(id)]; if(!sc){ return; }
  cur = id; completed = false; transitioning = false; visit++;
  optsBox.replaceChildren(); optsBox.style.display = 'none';
  nextBtn.style.display = 'none'; playbackError.style.display = 'none';
  restartBtn.style.display = 'block';
  // A new frame prevents messages or media from a previous node affecting this one.
  if(page){ page.remove(); }
  page = document.createElement('iframe');
  page.id = 'page'; page.title = sc.name;
  page.setAttribute('sandbox', 'allow-scripts');
  page.setAttribute('allow', 'autoplay');
  page.src = 'dist/' + sc.html;
  stage.appendChild(page);
}
window.addEventListener('message', function(e){
  if(!page || e.source !== page.contentWindow || !e.data || e.data.channel !== 'galgame-content'){ return; }
  if(e.data.type === 'ready'){
    syncBar();
    if(!e.data.hasVideo && !completed && DATA[String(cur)].options.length){ nextBtn.style.display = 'block'; }
  }else if(e.data.type === 'ended'){
    afterContent();
  }else if(e.data.type === 'error'){
    nextBtn.style.display = 'none'; optsBox.style.display = 'none';
    playbackErrorText.textContent = '视频无法播放，请检查文件或视频编码。';
    playbackError.style.display = 'flex';
  }
});
function afterContent(){
  if(completed){ return; }
  completed = true; nextBtn.style.display = 'none';
  var sc = DATA[String(cur)]; if(!sc){ return; }
  var currentVisit = visit;
  if(sc.options.length === 1 && !sc.options[0].isShow && runtime.eligible(sc.options[0],state.values)){ choose(sc.options[0],currentVisit); return; }
  var visibleOptions = sc.options.filter(function(o){ return o.isShow && runtime.eligible(o,state.values); });
  optsBox.replaceChildren(); optsBox.style.display = 'none';
  if(visibleOptions.length){
    visibleOptions.forEach(function(o){
      var btn = document.createElement('button'); btn.className = 'opt'; btn.textContent = o.label;
      btn.onclick = function(){ choose(o,currentVisit); }; optsBox.appendChild(btn);
    });
    optsBox.style.display = 'flex';
  }
  // Terminal nodes keep their HTML or final video frame visible.
}
nextBtn.addEventListener('click', afterContent);
function begin(nextState){
  state = nextState; started = true;
  document.getElementById('start-wrap').style.display = 'none';
  persist(); syncRoute(); show(state.currentNode);
}
restartBtn.addEventListener('click', function(){ if(confirm('重新开始会清空当前游玩进度，确定吗？')) begin(runtime.initial()); });
document.getElementById('start').addEventListener('click', function(){
  if(saved && !confirm('开始新游戏将覆盖已有进度，确定吗？')) return;
  begin(runtime.initial());
});
document.getElementById('continue').addEventListener('click', function(){ if(saved) begin(saved); });
</script>
</body>
</html>
